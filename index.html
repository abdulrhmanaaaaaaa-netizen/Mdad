<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="مِداد — استوديو ذكي للكتابة والبحث وصناعة الأفكار.">
  <title>مِداد — استوديو الإبداع والمعرفة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#home" data-page="home" aria-label="مِداد - الرئيسية">
          <span class="brand-mark"><i></i><i></i><i></i></span>
          <span class="brand-copy"><strong>مِداد</strong><small>MIDĀD STUDIO</small></span>
        </a>
        <button class="icon-button close-sidebar" id="closeSidebar" aria-label="إغلاق القائمة">×</button>
      </div>
      <button class="new-chat-btn" id="newChatBtn"><span class="plus">＋</span><span>محادثة جديدة</span><kbd>⌘ K</kbd></button>
      <div class="side-group">
        <div class="side-label">مساحة العمل</div>
        <button class="nav-link active" data-page="home"><span class="nav-icon">⌂</span><span>الرئيسية</span></button>
        <button class="nav-link" data-page="chat"><span class="nav-icon">◌</span><span>المساعد الذكي</span><span class="nav-dot"></span></button>
        <button class="nav-link" data-page="stories"><span class="nav-icon">▤</span><span>القصص والروايات</span></button>
        <button class="nav-link" data-page="research"><span class="nav-icon">⌕</span><span>البحوث والدراسات</span></button>
        <button class="nav-link" data-page="documents"><span class="nav-icon">▧</span><span>المستندات</span></button>
      </div>
      <div class="side-group">
        <div class="side-label">المكتبة</div>
        <button class="nav-link" data-page="library"><span class="nav-icon">▥</span><span>مكتبتي</span></button>
        <button class="nav-link" data-page="templates"><span class="nav-icon">▦</span><span>القوالب</span></button>
      </div>
      <div class="side-recent" id="sideRecent"><div class="side-label">الأخيرة</div><div class="recent-placeholder">ستظهر محادثاتك هنا</div></div>
      <div class="sidebar-bottom">
        <div class="plan-card"><div class="plan-top"><span class="tiny-spark">✳</span><span>مساحة مِداد</span><span class="local-badge">محلية</span></div><p>مشاريعك محفوظة على هذا الجهاز.</p></div>
        <button class="profile-button" data-page="settings"><span class="avatar">م</span><span class="profile-text"><strong>مساحة المستخدم</strong><small>الشخصية والاتصال</small></span><span class="more-dots">•••</span></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button mobile-menu" id="mobileMenu" aria-label="فتح القائمة">☰</button>
          <div class="breadcrumb"><span>مِداد</span><i>/</i><strong id="currentCrumb">الرئيسية</strong></div>
        </div>
        <div class="topbar-actions">
          <div class="connection-pill" id="connectionPill"><span class="status-dot"></span><span>اتصال المساعد غير مؤكد</span></div>
          <button class="icon-button" id="themeToggle" aria-label="تبديل المظهر">◐</button>
          <button class="icon-button" data-page="settings" aria-label="الإعدادات">⚙</button>
        </div>
      </header>
      <div class="page-wrap" id="pageRoot" aria-live="polite"></div>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
  <script src="persona.js"></script>
  <script src="app.js"></script>
</body>
</html>
