<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">رِيشة، رفيق مِداد</title>
  <desc id="desc">شخصية صغيرة لطيفة بعباءة زيتونية ووجه مضيء وريشة خضراء</desc>
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40573D"/><stop offset="1" stop-color="#1A2519"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7E7D1"/><stop offset="1" stop-color="#ABC8A3"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F7ED"/><stop offset="1" stop-color="#ABC8A3"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mascot{transform-origin:120px 128px;animation:bob 4s ease-in-out infinite}
      .eyes{transform-origin:120px 114px;animation:blink 5.3s infinite}
      .feather{transform-origin:166px 73px;animation:feather 3.8s ease-in-out infinite}
      .spark{transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
      @keyframes feather{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
      @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
      @media(prefers-reduced-motion:reduce){.mascot,.eyes,.feather,.spark{animation:none}}
    </style>
  </defs>
  <ellipse cx="120" cy="218" rx="64" ry="10" fill="#0B100B" opacity=".35"/>
  <g class="spark" fill="#ABC8A3" filter="url(#glow)"><path d="M34 59l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><circle cx="198" cy="43" r="3"/><path d="M205 158l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g>
  <g class="mascot">
    <path d="M49 191c5-49 25-83 61-94 42-13 79 9 89 56l-8 52H54z" fill="url(#cloak)" stroke="#ABC8A3" stroke-width="3"/>
    <path d="M44 105c-5-44 20-77 69-84 53-8 91 24 87 75-2 24-13 44-31 54-27 18-74 15-102-2-14-9-21-23-23-43z" fill="#172317" stroke="#ABC8A3" stroke-width="4"/>
    <path d="M62 93c2-33 22-56 55-61 37-6 68 13 70 46-16-8-33-13-54-12-25 1-48 10-71 27z" fill="#31452F"/>
    <path d="M66 112c0-29 23-52 54-52s54 23 54 52v26c0 25-22 43-54 43s-54-18-54-43z" fill="url(#face)" stroke="#D7E7D1" stroke-width="3"/>
    <g class="eyes" fill="#1A2519">
      <ellipse cx="96" cy="116" rx="7" ry="11"/>
      <ellipse cx="145" cy="116" rx="7" ry="11"/>
      <circle cx="98" cy="112" r="2.2" fill="#F1F7ED"/>
      <circle cx="147" cy="112" r="2.2" fill="#F1F7ED"/>
    </g>
    <path d="M111 139c6 8 15 8 21 0" fill="none" stroke="#1A2519" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="137" r="5" fill="#8FAE87" opacity=".65"/><circle cx="160" cy="137" r="5" fill="#8FAE87" opacity=".65"/>
    <path d="M53 174c16-17 27-21 42-17 9 3 13 12 11 21-2 9-11 14-22 12-12-2-21-7-31-16z" fill="#ABC8A3" stroke="#1A2519" stroke-width="4"/>
    <path d="M184 177c-13-16-24-20-38-16-10 3-13 12-11 21 2 9 11 14 22 12 11-2 19-7 27-17z" fill="#ABC8A3" stroke="#1A2519" stroke-width="4"/>
    <path d="M88 185l32 13 34-13 12 26H76z" fill="#ABC8A3" stroke="#1A2519" stroke-width="3"/>
    <path d="M120 186c-8 10-12 15-12 23 0 7 5 12 12 12s12-5 12-12c0-8-4-13-12-23z" fill="#1A2519" stroke="#ABC8A3" stroke-width="2"/>
    <path d="M120 193l-5 10 5-2 5 2z" fill="#ABC8A3"/>
    <g class="feather">
      <path d="M165 84c10-24 29-40 46-47-1 21-12 43-35 58-7 4-13-3-11-11z" fill="#ABC8A3" stroke="#1A2519" stroke-width="3"/>
      <path d="M166 91c14-13 26-26 39-45M177 78l-1-16m-6 25-12-6m23-5 12 1" fill="none" stroke="#56734F" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path d="M80 67c13-13 29-19 46-20" fill="none" stroke="#829E7A" stroke-width="3" stroke-linecap="round" opacity=".65"/>
    <path d="M105 205h30" stroke="#ABC8A3" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  </g>
</svg>
